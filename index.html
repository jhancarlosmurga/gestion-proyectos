<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Proyectos</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-indigo-600 px-6 py-8 sm:p-10 text-center">
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Gestion de Proyectos</h1>
                <p class="mt-4 text-indigo-100 text-base">
                    Complete cuidadosamente el formulario para registrar un nuevo proyecto
                </p>
            </div>

            <div class="px-6 py-8 sm:p-10">
                <div id="successMessage"
                    class="hidden mb-8 bg-green-50 border-l-4 border-green-500 p-4 rounded-md shadow-sm transition-all duration-300">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <svg class="h-6 w-6 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium text-green-800">
                                ¡Guardado! Los datos han sido enviados correctamente.
                            </p>
                        </div>
                    </div>
                </div>

                <form id="projectForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">

                        <div>
                            <label for="nombre_proyecto" class="block text-sm font-medium text-gray-700 mb-1">
                                Nombre del Proyecto
                            </label>
                            <input type="text" name="nombre_proyecto" id="nombre_proyecto" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Ej: Rediseño del portal web">
                        </div>

                        <div>
                            <label for="lo_mas_importante" class="block text-sm font-medium text-gray-700 mb-1">
                                Lo más importante
                            </label>
                            <input type="text" name="lo_mas_importante" id="lo_mas_importante" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200">
                        </div>

                        <div>
                            <label for="anio" class="block text-sm font-medium text-gray-700 mb-1">Año</label>
                            <input type="number" name="anio" id="anio" required min="2000" max="2100"
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Ej: 2025">
                        </div>

                        <div>
                            <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                            <input type="text" name="tipo" id="tipo" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200">
                        </div>

                        <div>
                            <label for="responsable" class="block text-sm font-medium text-gray-700 mb-1">
                                Responsable
                            </label>
                            <input type="text" name="responsable" id="responsable" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Nombre completo">
                        </div>

                        <div>
                            <label for="prioridad" class="block text-sm font-medium text-gray-700 mb-1">
                                Prioridad
                            </label>
                            <select name="prioridad" id="prioridad" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200">
                                <option value="" disabled selected>Seleccione la prioridad...</option>
                                <option value="ALTA">ALTA</option>
                                <option value="MEDIA">MEDIA</option>
                                <option value="BAJA">BAJA</option>
                            </select>
                        </div>

                        <div>
                            <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                            <input type="text" name="estado" id="estado" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Ej: PENDIENTE, EN PROCESO, TERMINADO">
                        </div>

                        <div>
                            <label for="area" class="block text-sm font-medium text-gray-700 mb-1">Área</label>
                            <input type="text" name="area" id="area" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Ej: SISTEMAS">
                        </div>

                        <div>
                            <label for="solicitud_usuario" class="block text-sm font-medium text-gray-700 mb-1">
                                Solicitud de Usuario
                            </label>
                            <input type="text" name="solicitud_usuario" id="solicitud_usuario" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200">
                        </div>

                        <div>
                            <label for="usuario_solicitante" class="block text-sm font-medium text-gray-700 mb-1">
                                Usuario Solicitante
                            </label>
                            <input type="text" name="usuario_solicitante" id="usuario_solicitante" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Correo o nombre del solicitante">
                        </div>

                        <div>
                            <label for="valorizacion" class="block text-sm font-medium text-gray-700 mb-1">
                                Valorización
                            </label>
                            <input type="text" name="valorizacion" id="valorizacion" required
                                class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                                placeholder="Ej: S/. 10,000.00">
                        </div>
                    </div>

                    <div class="mt-6">
                        <label for="beneficio" class="block text-sm font-medium text-gray-700 mb-1">Beneficio</label>
                        <textarea name="beneficio" id="beneficio" rows="3" required
                            class="w-full border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-200"
                            placeholder="Describa el beneficio o impacto esperado..."></textarea>
                    </div>

                    <div class="pt-6 flex justify-end border-t border-gray-100 mt-8">
                        <button type="submit" id="submitBtn"
                            class="inline-flex justify-center items-center py-3 px-8 border border-transparent shadow-md text-base font-semibold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 w-full sm:w-auto">
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <p class="text-center text-sm text-gray-400 mt-8">
            &copy;
            <script>document.write(new Date().getFullYear())</script> Sistema de Gestión
        </p>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzxbDFbupwWsVgMF51IlTqDM4Hs0urlBHxHN6Wjfyh3lTzweIHV2HMevanJGk-A1aJm/exec";

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');

            const originalText = submitBtn.innerHTML;

            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Guardando...
            `;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            successMessage.classList.add('hidden');

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(data)
                });

                form.reset();
                successMessage.classList.remove('hidden');
                successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });

                setTimeout(() => {
                    successMessage.classList.add('hidden');
                }, 5000);

            } catch (error) {
                console.error('Error al guardar:', error);
                alert('Hubo un error al intentar guardar el proyecto.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>

</html>
